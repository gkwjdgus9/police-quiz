[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evidence-organizer"
version = "0.1.0"
description = "사이버사기 증거 정리기 - 메신저 대화·이체내역에서 타임라인·범죄일람표·보고서 초안을 만드는 도구"
requires-python = ">=3.11"
# 원칙: 표준 라이브러리 + pandas 만 허용. 네트워크로 나가는 의존성은 추가하지 않는다.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
